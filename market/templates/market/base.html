{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Маркет{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'market/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="{% url 'products_list' %}">Маркет</a>

        <nav class="navigation">
            <a class="more-link" href="{% url 'products_list' %}" >Список продуктов</a>
            <a class="more-link" href="{% url 'product_add' %}" >Добавить продукт</a>
            <a class="more-link" href="{% url 'categories_list' %}" >Список Категорий</a>
            <a class="more-link" href="{% url 'category_add' %}" >Добавить Категорию</a>

        </nav>
    </header>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
